[project]
name = "clifforge"
version = "0.1.0"
description = "CLIFForge — synthetic CLIF 2.1 ICU dataset generator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "J.C. Rojas" }]
keywords = ["CLIF", "synthetic-data", "ICU", "healthcare"]

# Base dependencies are all permissive (MIT / BSD / Apache-2.0) for
# production redistribution. Heavier / license-sensitive tooling lives in
# optional extras so the default install stays lean and clean.
dependencies = [
    "polars>=1.0",
    "pandera[polars]>=0.20",
    "numpy>=1.26",
    "scipy>=1.11",
    "faker>=25.0",
]

[project.optional-dependencies]
# Utility / fidelity evaluation (R19, R24). Permissive: MIT.
eval = [
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "sdmetrics>=0.14",
]
# Privacy metrics (DCR, NN-distance ratio, identifiability) are computed
# standalone from numpy + scikit-learn (already in the `eval` extra), with NO
# torch/synthcity dependency (R20 — the goal is to *contain* the torch tree; we
# contain it to zero). synthcity 0.2.11's metrics module is unusable here: its
# resolved torch 2.2.2 is incompatible with the transformers it pulls
# (torch.nn.RMSNorm missing), so the standard metric definitions are implemented
# directly instead. See src/clifforge/eval/privacy.py.
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "clifpy>=0.5",
    # Reads clifpy's schemas/2.1/*.yaml to cross-check our canonical-DDL vendoring
    # against the consortium's other canonical artifact (see
    # tests/schemas/test_canonical_sources.py).
    "pyyaml>=6.0",
]
# Cohort Designer web app (`clif-forge ui`). Permissive: Apache-2.0 / BSD / MIT.
ui = [
    "streamlit>=1.30",
    "pandas>=2.0",
]

[project.scripts]
clif-forge = "clifforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clifforge"]

# Ship the shareable aggregate base pack (no real data) and the example presets
# inside the wheel, so `pip install clif-forge` can generate calibrated, realistic
# datasets standalone — not just the structural `--demo` pack. They live at the repo
# root for development; force-include copies them under the package for the wheel.
[tool.hatch.build.targets.wheel.force-include]
"base_pack" = "clifforge/_data/base_pack"
"presets" = "clifforge/_data/presets"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

# clifpy (advisory secondary conformance gate) ships no py.typed marker / stubs.
[[tool.mypy.overrides]]
module = ["clifpy.*"]
ignore_missing_imports = true

# scipy ships no bundled stubs (scipy-stubs is a separate optional package we
# do not depend on); the fit estimators use scipy.stats only for MLE/rank stats.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# The optional Cohort Designer UI depends on pandas + streamlit, neither of which
# ships bundled type stubs; the UI is a thin front-end and is not part of the
# generation core.
[[tool.mypy.overrides]]
module = ["pandas.*", "streamlit.*"]
ignore_missing_imports = true

# The `ui` extra is not installed in the lint/type CI job, so streamlit resolves to
# Any there and its `@st.cache_*` decorators read as untyped under strict mode. The
# UI module is a thin front-end (not the generation core), so relax just that one
# strict check for it — the module still type-checks everywhere else.
[[tool.mypy.overrides]]
module = ["clifforge.ui.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# clifpy's validator internals emit polars streaming-deprecation warnings we can't
# fix upstream; silence just those so the conformance suite output stays readable.
filterwarnings = [
    "ignore:the `streaming` parameter was deprecated:DeprecationWarning",
    # scipy's MLE for gamma/lognorm/weibull emits RuntimeWarnings on degenerate
    # (near-identical) inputs; the sojourn estimator guards with isfinite() and
    # falls back, so these are noise on tiny fabricated fixtures, not defects.
    "ignore::RuntimeWarning:scipy.stats._continuous_distns",
    # polars join_asof can't verify pre-sortedness when 'by' groups are given;
    # the AR1 estimator sorts explicitly before the as-of join.
    "ignore:Sortedness of columns cannot be checked:UserWarning",
]
